"$schema" = "./node_modules/wrangler/config-schema.json"
name = "placeshub-api"
main = "src/index.ts"
compatibility_date = "2025-10-16"
compatibility_flags = ["nodejs_compat_v2"]

[observability]
enabled = true

[vars]
# Set via `wrangler secret put` or Cloudflare dashboard
# DATABASE_URL = ""
# SUPABASE_URL = ""
# SUPABASE_KEY = ""  # Supabase anon key, not the service role key
# GOOGLE_PLACES_API_KEY = ""

[triggers]
crons = ["*/5 * * * *"]
