<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlacesHub Sync settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="options">
    <main>
      <header>
        <img src="icons/icon-48.png" alt="" />
        <h1>PlacesHub Sync settings</h1>
      </header>
      <p class="muted">Connect to PlacesHub to upload your Google Maps saved lists.</p>
      <form id="connection">
        <label for="appUrl">PlacesHub address</label>
        <input id="appUrl" type="url" placeholder="https://your-placeshub.example" required />
        <label for="token">Extension key (from PlacesHub Sync page)</label>
        <input id="token" type="password" autocomplete="off" />
        <p class="muted hint">Leave the key blank to keep your saved key when reconnecting to the same address.</p>
        <div class="actions">
          <button id="connect" type="submit" class="primary">Connect</button>
          <button id="disconnect" type="button">Disconnect</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js" type="module"></script>
  </body>
</html>
