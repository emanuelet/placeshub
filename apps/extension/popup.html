<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlacesHub Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" />
      <h1>PlacesHub Sync</h1>
      <button id="settings" type="button" aria-label="Open settings" title="Settings">Settings</button>
    </header>
    <p class="muted">Sign in to Google Maps, then open Saved, one list and a place within it. The extension checks selected lists each hour while Chrome is running.</p>
    <p id="connection" class="muted"></p>
    <div id="lists"></div>
    <div class="actions">
      <button id="sync" type="button" class="primary">Sync now</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="lastSync" class="muted"></p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
