<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/app/assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/app/assets/favicon.svg" />
    <link rel="shortcut icon" href="/app/assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app/assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PlacesHub" />
    <link rel="manifest" href="/app/assets/site.webmanifest" />
    <meta name="theme-color" content="#3155d9" />
    <meta
      name="description"
      content="PlacesHub turns your Google Maps saved lists into curated collections you can share as a map or KML export."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlacesHub" />
    <meta property="og:title" content="PlacesHub — your curated places, on one shareable map" />
    <meta
      property="og:description"
      content="Sync Google Maps lists, organise collections, share a map or KML export."
    />
    <meta property="og:image" content="/app/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>PlacesHub</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(function () {
        try {
          const stored = localStorage.getItem('theme')
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const isDark = stored === 'dark' || (stored !== 'light' && systemDark)
          if (isDark) document.getElementById('root')?.classList.add('dark')
          const palette = JSON.parse(localStorage.getItem('palette') || '"blue"')
          document.getElementById('root').dataset.palette = ['teal', 'purple'].includes(palette) ? palette : 'blue'
        } catch {}
      })()
    </script>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
