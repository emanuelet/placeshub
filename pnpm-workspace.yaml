packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: false
  workerd: true
onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - workerd
minimumReleaseAge: 4320

blockExoticSubdeps: true

trustPolicy: "no-downgrade"

strictDepBuilds: true

ignoreScripts: true

trustPolicyExclude:
  - semver
